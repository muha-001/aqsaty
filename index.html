  <body>
    <!-- ============================================================
         جذر تطبيق React
         ============================================================ -->
    <div id="root">
      <!--
        شاشة تحميل احترافية تظهر أثناء تحميل React
        يتم استبدالها تلقائياً عند جاهزية التطبيق
      -->
      <div class="boot-loader">
        <div class="boot-loader-inner">
          <div class="boot-logo">قسّط</div>
          <div class="boot-spinner">
            <div></div><div></div><div></div>
          </div>
          <p class="boot-text">جارٍ تجهيز تجربة التقسيط…</p>
        </div>
      </div>
    </div>

    <!-- ============================================================
         كود JavaScript المطلوب لتشغيل حركات Scroll Reveal
         ============================================================ -->
    <script>
      /* ------------------------------------------------------------
         1) إزالة شاشة التحميل بعد جاهزية الصفحة
         ------------------------------------------------------------ */
      window.addEventListener('load', () => {
        document.body.classList.add('is-ready');
      });

      /* ------------------------------------------------------------
         2) Intersection Observer — إظهار العناصر عند التمرير إليها
         يعمل على أي عنصر يحمل الصنف reveal-item
         ------------------------------------------------------------ */
      (function initScrollReveal() {
        const run = () => {
          const items = document.querySelectorAll('.reveal-item');
          if (!items.length) return;

          const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (prefersReduced || !('IntersectionObserver' in window)) {
            items.forEach((el) => el.classList.add('is-visible'));
            return;
          }

          const observer = new IntersectionObserver(
            (entries, obs) => {
              entries.forEach((entry) => {
                if (entry.isIntersecting) {
                  entry.target.classList.add('is-visible');
                  obs.unobserve(entry.target);
                }
              });
            },
            {
              threshold: 0.12,
              rootMargin: '0px 0px -60px 0px',
            }
          );

          items.forEach((el) => observer.observe(el));
        };

        // تنفيذ بعد تحميل الصفحة، مع إعادة المحاولة عند إضافة عناصر جديدة (React)
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', run);
        } else {
          run();
        }

        // إعادة الفحص عند تغيير DOM (مفيد لتطبيقات React)
        const mo = new MutationObserver(() => {
          const items = document.querySelectorAll('.reveal-item:not(.is-visible)');
          if (items.length) run();
        });
        mo.observe(document.body, { childList: true, subtree: true });
      })();
    </script>

    <!-- ============================================================
         نقطة دخول تطبيق React (Vite)
         ============================================================ -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
